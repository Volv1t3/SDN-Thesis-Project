name: sdn-mpls-ai-techdemonstrator-baseline

mgmt:
  network: sma-mgmt
  ipv4-subnet: 172.21.121.0/24

topology:
  kinds:
    cisco_xrv:
      image: vrnetlab/cisco_xrv:6.6.3
      startup-config: ../../configurations/tech-demonstrator/__clabNodeName__.cfg
      env:
        QEMU_MEMORY: 3072
        QEMU_SMP: 1

    linux:
      image: ubuntu:22.04

  nodes:
    sma-xrv-lsr1-alpha:
      kind: cisco_xrv
      mgmt-ipv4: 172.21.121.11

    sma-xrv-lsr2-bravo:
      kind: cisco_xrv
      mgmt-ipv4: 172.21.121.12

    sma-xrv-lsr3-charlie:
      kind: cisco_xrv
      mgmt-ipv4: 172.21.121.13

    sma-xrv-lsr4-delta:
      kind: cisco_xrv
      mgmt-ipv4: 172.21.121.14

    sma-ovs-pe1-echo:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-ovs-edge-tools:0.23.1-baseline
      mgmt-ipv4: 172.21.121.15
      image-pull-policy: Always
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_MODULE
      exec:
        - mkdir -p /usr/local/etc/openvswitch
        - mkdir -p /usr/local/var/run/openvswitch
        - sh -lc '[ -f /usr/local/etc/openvswitch/conf.db ] || ovsdb-tool create /usr/local/etc/openvswitch/conf.db /usr/local/share/openvswitch/vswitch.ovsschema'
        - ovsdb-server --remote=punix:/usr/local/var/run/openvswitch/db.sock --remote=db:Open_vSwitch,Open_vSwitch,manager_options --pidfile --detach
        - ovs-vsctl --no-wait init
        - ovs-vswitchd unix:/usr/local/var/run/openvswitch/db.sock --pidfile --detach
        - ovs-vsctl --may-exist add-br sma-ovs-pe1-echo
        - ovs-vsctl set bridge sma-ovs-pe1-echo datapath_type=netdev
        - ovs-vsctl --may-exist add-port sma-ovs-pe1-echo host-golf 
        - ovs-vsctl --may-exist add-port sma-ovs-pe1-echo core-lsr1
        - ovs-vsctl set-manager tcp:172.21.121.100:6640
        - ovs-vsctl set-controller sma-ovs-pe1-echo tcp:172.21.121.100:6653
        - ovs-vsctl set bridge sma-ovs-pe1-echo protocols=OpenFlow13
        - ovs-ofctl -O OpenFlow13 del-flows sma-ovs-pe1-echo
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe1-echo "priority=300,arp,in_port=host-golf,actions=output:core-lsr1"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe1-echo "priority=300,arp,in_port=core-lsr1,actions=output:host-golf"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe1-echo "priority=200,ip,in_port=host-golf,actions=CONTROLLER:65535,output:core-lsr1"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe1-echo "priority=200,ip,in_port=core-lsr1,actions=output:host-golf"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe1-echo "priority=0,actions=drop"
      # stages:
      #   create:
      #     wait-for:
      #       - node: sma-xrv-lsr1-alpha
      #         stage: healthy

    sma-ovs-pe2-foxtrot:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-ovs-edge-tools:0.23.1-baseline
      mgmt-ipv4: 172.21.121.16
      image-pull-policy: Always
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_MODULE
      exec:
        - mkdir -p /usr/local/etc/openvswitch
        - mkdir -p /usr/local/var/run/openvswitch
        - sh -lc '[ -f /usr/local/etc/openvswitch/conf.db ] || ovsdb-tool create /usr/local/etc/openvswitch/conf.db /usr/local/share/openvswitch/vswitch.ovsschema'
        - ovsdb-server --remote=punix:/usr/local/var/run/openvswitch/db.sock --remote=db:Open_vSwitch,Open_vSwitch,manager_options --pidfile --detach
        - ovs-vsctl --no-wait init
        - ovs-vswitchd unix:/usr/local/var/run/openvswitch/db.sock --pidfile --detach
        - ovs-vsctl --may-exist add-br sma-ovs-pe2-foxtrot
        - ovs-vsctl set bridge sma-ovs-pe2-foxtrot datapath_type=netdev
        - ovs-vsctl --may-exist add-port sma-ovs-pe2-foxtrot host-hotel
        - ovs-vsctl --may-exist add-port sma-ovs-pe2-foxtrot core-lsr4
        - ovs-vsctl set-manager tcp:172.21.121.100:6640
        - ovs-vsctl set-controller sma-ovs-pe2-foxtrot tcp:172.21.121.100:6653
        - ovs-vsctl set bridge sma-ovs-pe2-foxtrot protocols=OpenFlow13
        - ovs-ofctl -O OpenFlow13 del-flows sma-ovs-pe2-foxtrot
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe2-foxtrot "priority=300,arp,in_port=host-hotel,actions=output:core-lsr4"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe2-foxtrot "priority=300,arp,in_port=core-lsr4,actions=output:host-hotel"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe2-foxtrot "priority=200,ip,in_port=host-hotel,actions=CONTROLLER:65535,output:core-lsr4"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe2-foxtrot "priority=200,ip,in_port=core-lsr4,actions=output:host-hotel"
        - ovs-ofctl -O OpenFlow13 add-flow sma-ovs-pe2-foxtrot "priority=0,actions=drop"
      # stages:
      #   create:
      #     wait-for:
      #       - node: sma-xrv-lsr4-delta
      #         stage: healthy

      

    sma-ubuntu-edge-golf:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-ubuntu-edge-tools:0.23.1-baseline
      mgmt-ipv4: 172.21.121.17
      image-pull-policy: Always
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      exec: 
        - sudo ip addr add 192.168.10.10/24 dev eth1
        - sudo ip link set eth1 up
        - sudo ip link set dev eth1 mtu 1496
        - sudo ip route add 192.168.20.0/24 via 192.168.10.1 dev eth1
        - sudo ip route add 10.0.0.0/8 via 192.168.10.1 dev eth1
        - sudo ip route add 10.100.0.0/16 via 192.168.10.1 dev eth1

    sma-ubuntu-edge-hotel:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-ubuntu-edge-tools:0.23.1-baseline
      mgmt-ipv4: 172.21.121.18
      image-pull-policy: Always
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      exec:
        - sudo ip addr add 192.168.20.10/24 dev eth1
        - sudo ip link set eth1 up
        - sudo ip link set dev eth1 mtu 1496
        - sudo ip route add 192.168.10.0/24 via 192.168.20.1 dev eth1
        - sudo ip route add 10.0.0.0/8 via 192.168.20.1 dev eth1
        - sudo ip route add 10.100.0.0/16 via 192.168.20.1 dev eth1


    sma-odl-controller-india:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-opendaylight:0.23.1-baseline
      mgmt-ipv4: 172.21.121.100
      memory: 6G
      env:
        JAVA_MIN_MEM: 4G
        JAVA_MAX_MEM: 6G
        TUNNEL_CREATION_MODE: DELEGATED_TUNNEL_UPDATE
        SMA_LOG_DIRECTORY: /logs
        SMA_LOG_FILENAME: sdn_mpls_ml_controller.log
        SMA_LOG_FILE_MAX_BYTES: 10485760
        SMA_LOG_FILE_BACKUP_COUNT: 5
        SMA_LOG_LEVEL: DEBUG

        ODL_BGPLS_TOPOLOGY_ID: sma-bgp-linkstate-topology
        ODL_PCEP_TOPOLOGY_ID: pcep-topology
        ODL_PATH_COMPUTATION_GRAPH_NAME: ted://sma-bgp-linkstate-topology

        SMA_HEADEND_RID: 11.11.11.11
        SMA_HEADEND_PCC_NODE: pcc://10.100.10.1

        SMA_TAILEND_RID: 14.14.14.14
        SMA_TAILEND_PCC_NODE: pcc://10.100.40.1

        SMA_FORWARD_LSP_NAME: sma-lsr1-lsr4-delegated
        SMA_REVERSE_LSP_NAME: sma-lsr4-lsr1-delegated
        SMA_FORWARD_TUNNEL_INTERFACE: tunnel-te110
        SMA_REVERSE_TUNNEL_INTERFACE: tunnel-te410
        SMA_FORWARD_DIRECTION_KEY: lsr1_to_lsr4
        SMA_REVERSE_DIRECTION_KEY: lsr4_to_lsr1

        SMA_HEADEND_TO_TAILEND_INGRESS: sma-ovs-pe1-echo|host-golf
        SMA_TAILEND_TO_HEADEND_INGRESS: sma-ovs-pe2-foxtrot|host-hotel

        ODL_RESTCONF_DATA_BASE_URL: http://127.0.0.1:8182/restconf/data
        ODL_RESTS_OPERATIONS_BASE_URL: http://127.0.0.1:8181/rests/operations
        ODL_USERNAME: admin
        ODL_PASSWORD: admin

        CLASSIFIER_BASE_URL: http://172.21.121.200:33761
        CLASSIFIER_CLASSIFY_PATH: /api/v1/classify

        CLASSIFICATION_CACHE_TTL_SECONDS: 3600
        PATH_CACHE_TTL_SECONDS: 60
        TOPOLOGY_CACHE_TTL_SECONDS: 300

        ODL_OPERATIONAL_VALIDATION_TIMEOUT_SECONDS: 120
        HTTP_REQUEST_TIMEOUT_SECONDS: 10

        ODL_RETRY_INITIAL_DELAY_MS: 500
        ODL_RETRY_MAX_DELAY_MS: 5000
        ODL_RETRY_JITTER_PERCENT: 20
        ODL_TOPOLOGY_DISCOVERY_MAX_ATTEMPTS: 5

        SMA_OPENFLOW_BOOTSTRAP_ENABLED: true
        SMA_OPENFLOW_TABLE_ID: 0

        
        SMA_OVS_ECHO_MGMT_IP: 172.21.121.15
        SMA_OVS_ECHO_HOST_PORT_NAME: host-golf
        SMA_OVS_ECHO_CORE_PORT_NAME: core-lsr1

        SMA_OVS_FOXTROT_MGMT_IP: 172.21.121.16
        SMA_OVS_FOXTROT_HOST_PORT_NAME: host-hotel
        SMA_OVS_FOXTROT_CORE_PORT_NAME: core-lsr4

        SMA_OPENFLOW_ARP_PRIORITY: 300
        SMA_OPENFLOW_IPV4_PRIORITY: 200

        SMA_OPENFLOW_INSTALL_DEFAULT_DROP: false
        SMA_OPENFLOW_DEFAULT_DROP_PRIORITY: 0
      image-pull-policy: Always
      cap-add:
        - NET_ADMIN
        - NET_BIND_SERVICE
        - SYS_ADMIN
      exec:
        - sudo ip link set dev eth1 up
        - sudo ip address replace 10.100.10.2/30 dev eth1
        - sudo ip link set dev eth2 up
        - sudo ip address replace 10.100.20.2/30 dev eth2
        - sudo ip link set dev eth3 up
        - sudo ip address replace 10.100.30.2/30 dev eth3
        - sudo ip link set dev eth4 up
        - sudo ip address replace 10.100.40.2/30 dev eth4
      binds:
        - ../../data-folders/karaf-csa-logs:/logs
      # stages:
      #   create:
      #     wait-for:
      #       - node: sma-xrv-lsr1-alpha
      #         stage: healthy
      #       - node: sma-xrv-lsr2-bravo
      #         stage: healthy
      #       - node: sma-xrv-lsr3-charlie
      #         stage: healthy
      #       - node: sma-xrv-lsr4-delta
      #         stage: healthy
    
    sma-odl-ml-api-kilo:
      kind: linux
      image: docker.io/arellanosantiago/sdn-mpls-ai-tech-demo-python-inference-api:0.23.1-baseline
      image-pull-policy: Always
      ports:
        - 33761:33761
      cap-add:
        - NET_ADMIN
        - SYS_ADMIN
      mgmt-ipv4: 172.21.121.200
      env:
        APP_NAME: sma-ml-api-kilo
        APP_VERSION: 0.1.0
        CLASSIFICATION_MODE: MODEL 
        CONFIG_DIR: configs
        DETERMINISTIC_RULE_FILENAME: sdn_mpls_ml_traffic_class_deterministic_rules.json
        POLICY_FILENAME: sdn_mpls_ml_traffic_class_to_policy_mapping.json
        ENABLE_POLICY_MAPPING: true
        HOST: 0.0.0.0
        PORT: 33761
        LOG_LEVEL: DEBUG   
        MAX_REQUEST_BODY_BYTES: 16384 
        MAX_TUNNEL_BANDWIDTH_KBPS: 75000
        MIN_TUNNEL_BANDWIDTH_KBPS: 10000
        MIN_POLICY_CONFIDENCE: 0.75 
        MODEL_DIR: models 
        MODEL_FILENAME: sdn_mpls_ml_model.json
        MODEL_METADATA_FILENAME: sdn_mpls_ml_model_meta.json
        PROBABILITY_TOLERANCE: 0.001
        REQUEST_TIMEOUT_SECONDS: 10
        LOG_DIRECTORY: logs
        LOG_FILE_BACKUP_COUNT: 5 
        LOG_FILE_MAX_BYTES: 10485760
        LOG_FILENAME: sdn_mpls_ml_api.log
      binds:
        - ../../data-folders/ml-api-logs:/api/logs
      

    sma-obs-grafana-lima:
      kind: linux
      image: docker.io/grafana/grafana:13.1.2-ubuntu
      image-pull-policy: Always
      mgmt-ipv4: 172.21.121.201
      ports:
        - 34761:34761
      env:
        GF_SERVER_HTTP_PORT: 34761
        GF_SECURITY_ADMIN_USER: clab
        GF_SECURITY_ADMIN_PASSWORD: clab@123
        GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      binds:
        - ../../data-folders/grafana-data:/var/lib/grafana
        - ../../configurations/tech-demonstrator/services/provisioning:/etc/grafana/provisioning:ro


    sma-obs-prometheus-mike:
      kind: linux
      image: docker.io/prom/prometheus:v3.13.2
      image-pull-policy: Always
      mgmt-ipv4: 172.21.121.202
      ports:
        - 34762:33762
      cmd: >
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --web.console.libraries=/usr/share/prometheus/console_libraries
        --web.console.templates=/usr/share/prometheus/consoles
        --storage.tsdb.retention.time=5d
        --web.listen-address=0.0.0.0:34762
      binds:
        - ../../configurations/tech-demonstrator/services/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - ../../data-folders/prometheus-data:/prometheus

    sma-link-bandwidth-bootstrap:
        kind: host
        exec:
        # ---------------------------------------------------------
        # MPLS LSR Core: Baseline rhombus links
        # ---------------------------------------------------------

        # LSR1 Alpha <-> LSR2 Bravo
        # Subnet: 10.0.11.0/30
        # Capacity: 50,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha -i Gi0/0/0/1 --rate 50000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo -i Gi0/0/0/1 --rate 50000

        # LSR1 Alpha <-> LSR3 Charlie
        # Subnet: 10.0.12.0/30
        # Revised Capacity: 75,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha -i Gi0/0/0/2 --rate 75000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie -i Gi0/0/0/2 --rate 75000

        # LSR2 Bravo <-> LSR4 Delta
        # Subnet: 10.0.21.0/30
        # Capacity: 50,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo -i Gi0/0/0/0 --rate 50000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta -i Gi0/0/0/2 --rate 50000

        # LSR3 Charlie <-> LSR4 Delta
        # Subnet: 10.0.22.0/30
        # Revised Capacity: 75,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie -i Gi0/0/0/1 --rate 75000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta -i Gi0/0/0/1 --rate 75000

        # ---------------------------------------------------------
        # Extended Topology Links: Additional constrained links
        # ---------------------------------------------------------

        # LSR1 Alpha <-> LSR2 Bravo additional diagonal
        # Subnet: 10.0.13.0/30
        # Capacity: 25,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha -i Gi0/0/0/4 --rate 25000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo -i Gi0/0/0/2 --rate 25000

        # LSR1 Alpha <-> LSR4 Delta direct constrained shortcut
        # Subnet: 10.0.14.0/30
        # Capacity: 10,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha -i Gi0/0/0/5 --rate 10000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta -i Gi0/0/0/6 --rate 10000

        # LSR2 Bravo <-> LSR3 Charlie vertical interconnection
        # Subnet: 10.0.23.0/30
        # Capacity: 10,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo -i Gi0/0/0/5 --rate 10000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie -i Gi0/0/0/4 --rate 10000

        # LSR2 Bravo <-> LSR4 Delta additional diagonal
        # Subnet: 10.0.24.0/30
        # Capacity: 25,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo -i Gi0/0/0/4 --rate 25000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta -i Gi0/0/0/4 --rate 25000

        # LSR3 Charlie <-> LSR4 Delta additional high-bandwidth path
        # Subnet: 10.0.25.0/30
        # Capacity: 75,000 kbps
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie -i Gi0/0/0/0 --rate 75000
        - sudo containerlab tools netem set -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta -i Gi0/0/0/5 --rate 75000

        # ---------------------------------------------------------
        # Verification
        # ---------------------------------------------------------
        - sudo containerlab tools netem show -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha
        - sudo containerlab tools netem show -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo
        - sudo containerlab tools netem show -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie
        - sudo containerlab tools netem show -n clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta

  # links:
  #   # ---------------------------------------------------------
  #   # Left host edge: Ubuntu host Golf -> OVS Echo -> LSR1 Alpha
  #   # ---------------------------------------------------------
  #   - endpoints:
  #       - sma-ubuntu-edge-golf:eth1
  #       - sma-ovs-pe1-echo:host-golf

  #   - endpoints:
  #       - sma-ovs-pe1-echo:core-lsr1
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/0

  #   # ---------------------------------------------------------
  #   # Right host edge: LSR4 Delta -> OVS Foxtrot -> Ubuntu host Hotel
  #   # ---------------------------------------------------------
  #   - endpoints:
  #       - sma-xrv-lsr4-delta:Gi0/0/0/0
  #       - sma-ovs-pe2-foxtrot:core-lsr4

  #   - endpoints:
  #       - sma-ovs-pe2-foxtrot:host-hotel
  #       - sma-ubuntu-edge-hotel:eth1

  #   # ---------------------------------------------------------
  #   # MPLS LSR Core: LSR1 Alpha, LSR2 Bravo, LSR3 Charlie and LSR4 Delta
  #   # ---------------------------------------------------------
  #   - endpoints:
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/1
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/1

  #   - endpoints:
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/2
  #       - sma-xrv-lsr3-charlie:Gi0/0/0/2

  #   - endpoints:
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/0
  #       - sma-xrv-lsr4-delta:Gi0/0/0/2

  #   - endpoints:
  #       - sma-xrv-lsr3-charlie:Gi0/0/0/1
  #       - sma-xrv-lsr4-delta:Gi0/0/0/1

  #   # ---------------------------------------------------------
  #   # BGP-LS & PCE/PCC Links: LSR1, LSR2, LSR3, LSR4 to ODL India
  #   # ---------------------------------------------------------
  #   - endpoints:
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/3
  #       - sma-odl-controller-india:eth1

  #   - endpoints:
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/3
  #       - sma-odl-controller-india:eth2

  #   - endpoints:
  #       - sma-xrv-lsr3-charlie:Gi0/0/0/3
  #       - sma-odl-controller-india:eth3

  #   - endpoints:
  #       - sma-xrv-lsr4-delta:Gi0/0/0/3
  #       - sma-odl-controller-india:eth4

  #   # ---------------------------------------------------------
  #   # Extended Topology Links: Additional constrainted bandwidth links
  #   # ---------------------------------------------------------
  #   - endpoints:
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/4
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/2
  #   - endpoints:
  #       - sma-xrv-lsr1-alpha:Gi0/0/0/5
  #       - sma-xrv-lsr4-delta:Gi0/0/0/6
  #   - endpoints: 
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/5
  #       - sma-xrv-lsr3-charlie:Gi0/0/0/4
  #   - endpoints:
  #       - sma-xrv-lsr2-bravo:Gi0/0/0/4
  #       - sma-xrv-lsr4-delta:Gi0/0/0/4
  #   - endpoints: 
  #       - sma-xrv-lsr3-charlie:Gi0/0/0/0
  #       - sma-xrv-lsr4-delta:Gi0/0/0/5
  links:
    # ---------------------------------------------------------
    # Left host edge: Ubuntu host Golf -> OVS Echo -> LSR1 Alpha
    # ---------------------------------------------------------
    - type: veth
      endpoints:
        - node: sma-ubuntu-edge-golf
          interface: eth1
        - node: sma-ovs-pe1-echo
          interface: host-golf
      vars:
        link_role: access_host_to_ovs
        bandwidth_enforced: "false"

    - type: veth
      endpoints:
        - node: sma-ovs-pe1-echo
          interface: core-lsr1
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/0
      vars:
        link_role: access_ovs_to_lsr
        subnet: 192.168.10.0/24
        bandwidth_enforced: "false"

    # ---------------------------------------------------------
    # Right host edge: LSR4 Delta -> OVS Foxtrot -> Ubuntu host Hotel
    # ---------------------------------------------------------
    - type: veth
      endpoints:
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/0
        - node: sma-ovs-pe2-foxtrot
          interface: core-lsr4
      vars:
        link_role: access_lsr_to_ovs
        subnet: 192.168.20.0/24
        bandwidth_enforced: "false"

    - type: veth
      endpoints:
        - node: sma-ovs-pe2-foxtrot
          interface: host-hotel
        - node: sma-ubuntu-edge-hotel
          interface: eth1
      vars:
        link_role: access_ovs_to_host
        bandwidth_enforced: "false"

    # ---------------------------------------------------------
    # MPLS LSR Core: Baseline rhombus links
    # Bandwidth values must be mirrored in IOS XR interface
    # bandwidth and RSVP bandwidth configuration.
    # ---------------------------------------------------------

    # LSR1 Alpha <-> LSR2 Bravo
    # Subnet: 10.0.11.0/30
    # Capacity: 50,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/1
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/1
      vars:
        link_role: mpls_core
        subnet: 10.0.11.0/30
        bandwidth_kbps: 50000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core
        sma.subnet: 10.0.11.0/30
        sma.bandwidth-kbps: "50000"

    # LSR1 Alpha <-> LSR3 Charlie
    # Subnet: 10.0.12.0/30
    # Previous capacity: 100,000 kbps
    # Revised capacity: 75,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/2
        - node: sma-xrv-lsr3-charlie
          interface: Gi0/0/0/2
      vars:
        link_role: mpls_core
        subnet: 10.0.12.0/30
        bandwidth_kbps: 75000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core
        sma.subnet: 10.0.12.0/30
        sma.bandwidth-kbps: "75000"

    # LSR2 Bravo <-> LSR4 Delta
    # Subnet: 10.0.21.0/30
    # Capacity: 50,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/0
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/2
      vars:
        link_role: mpls_core
        subnet: 10.0.21.0/30
        bandwidth_kbps: 50000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core
        sma.subnet: 10.0.21.0/30
        sma.bandwidth-kbps: "50000"

    # LSR3 Charlie <-> LSR4 Delta
    # Subnet: 10.0.22.0/30
    # Previous capacity: 100,000 kbps
    # Revised capacity: 75,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr3-charlie
          interface: Gi0/0/0/1
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/1
      vars:
        link_role: mpls_core
        subnet: 10.0.22.0/30
        bandwidth_kbps: 75000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core
        sma.subnet: 10.0.22.0/30
        sma.bandwidth-kbps: "75000"

    # ---------------------------------------------------------
    # BGP-LS & PCE/PCC Links: LSR1, LSR2, LSR3, LSR4 to ODL India
    # These are control-plane links and are not part of the
    # MPLS-TE constrained-bandwidth data-plane model.
    # ---------------------------------------------------------
    - type: veth
      endpoints:
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/3
        - node: sma-odl-controller-india
          interface: eth1
      vars:
        link_role: odl_control
        subnet: 10.100.10.0/30
        bandwidth_enforced: "false"

    - type: veth
      endpoints:
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/3
        - node: sma-odl-controller-india
          interface: eth2
      vars:
        link_role: odl_control
        subnet: 10.100.20.0/30
        bandwidth_enforced: "false"

    - type: veth
      endpoints:
        - node: sma-xrv-lsr3-charlie
          interface: Gi0/0/0/3
        - node: sma-odl-controller-india
          interface: eth3
      vars:
        link_role: odl_control
        subnet: 10.100.30.0/30
        bandwidth_enforced: "false"

    - type: veth
      endpoints:
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/3
        - node: sma-odl-controller-india
          interface: eth4
      vars:
        link_role: odl_control
        subnet: 10.100.40.0/30
        bandwidth_enforced: "false"

    # ---------------------------------------------------------
    # Extended Topology Links: Additional constrained-bandwidth links
    # Bandwidth values must be mirrored in IOS XR interface
    # bandwidth and RSVP bandwidth configuration.
    # ---------------------------------------------------------

    # LSR1 Alpha <-> LSR2 Bravo additional diagonal
    # Subnet: 10.0.13.0/30
    # Capacity: 25,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/4
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/2
      vars:
        link_role: mpls_core_extended
        subnet: 10.0.13.0/30
        bandwidth_kbps: 25000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core-extended
        sma.subnet: 10.0.13.0/30
        sma.bandwidth-kbps: "25000"

    # LSR1 Alpha <-> LSR4 Delta direct constrained shortcut
    # Subnet: 10.0.14.0/30
    # Capacity: 10,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr1-alpha
          interface: Gi0/0/0/5
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/6
      vars:
        link_role: mpls_core_extended
        subnet: 10.0.14.0/30
        bandwidth_kbps: 10000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core-extended
        sma.subnet: 10.0.14.0/30
        sma.bandwidth-kbps: "10000"

    # LSR2 Bravo <-> LSR3 Charlie vertical interconnection
    # Subnet: 10.0.23.0/30
    # Capacity: 10,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/5
        - node: sma-xrv-lsr3-charlie
          interface: Gi0/0/0/4
      vars:
        link_role: mpls_core_extended
        subnet: 10.0.23.0/30
        bandwidth_kbps: 10000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core-extended
        sma.subnet: 10.0.23.0/30
        sma.bandwidth-kbps: "10000"

    # LSR2 Bravo <-> LSR4 Delta additional diagonal
    # Subnet: 10.0.24.0/30
    # Capacity: 25,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr2-bravo
          interface: Gi0/0/0/4
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/4
      vars:
        link_role: mpls_core_extended
        subnet: 10.0.24.0/30
        bandwidth_kbps: 25000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core-extended
        sma.subnet: 10.0.24.0/30
        sma.bandwidth-kbps: "25000"

    # LSR3 Charlie <-> LSR4 Delta additional diagonal/high-bandwidth path
    # Subnet: 10.0.25.0/30
    # Capacity: 75,000 kbps
    - type: veth
      endpoints:
        - node: sma-xrv-lsr3-charlie
          interface: Gi0/0/0/0
        - node: sma-xrv-lsr4-delta
          interface: Gi0/0/0/5
      vars:
        link_role: mpls_core_extended
        subnet: 10.0.25.0/30
        bandwidth_kbps: 75000
        bandwidth_enforced: "true"
      labels:
        sma.link-role: mpls-core-extended
        sma.subnet: 10.0.25.0/30
        sma.bandwidth-kbps: "75000"
