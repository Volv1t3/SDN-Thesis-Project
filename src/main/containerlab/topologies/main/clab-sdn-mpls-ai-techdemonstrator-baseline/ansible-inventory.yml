all:
  vars:
    # The generated inventory is assumed to be used from the clab host.
    # Hence no http proxy should be used. Therefore we make sure the http
    # module does not attempt using any global http proxy.
    ansible_httpapi_use_proxy: false
  children:
    cisco_xrv:
      vars:
        # ansible_connection: set ansible_connection variable if required
        ansible_user: clab
        ansible_password: clab@123
      hosts:
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr1-alpha:
          ansible_host: 172.21.121.11
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr2-bravo:
          ansible_host: 172.21.121.12
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr3-charlie:
          ansible_host: 172.21.121.13
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-xrv-lsr4-delta:
          ansible_host: 172.21.121.14
    linux:
      hosts:
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-odl-controller-india:
          ansible_host: 172.21.121.100
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-ovs-pe1-echo:
          ansible_host: 172.21.121.15
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-ovs-pe2-foxtrot:
          ansible_host: 172.21.121.16
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-ubuntu-edge-golf:
          ansible_host: 172.21.121.17
        clab-sdn-mpls-ai-techdemonstrator-baseline-sma-ubuntu-edge-hotel:
          ansible_host: 172.21.121.18
