apiVersion: 1

providers:
  - name: 'SDN-MPLS-ML Tech Demonstrator Dashboards'
    orgId: 1
    folder: 'SDN-MPLS-ML Tech Demonstrator'
    type: file
    disableDeletion: false
    # Values above 10 seconds force polling, which reliably detects updates
    # to dashboard JSON files exposed through the Containerlab bind mount.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
