name: Controller image

on:
  push:
    branches: ["master"]
    paths:
      - "src/main/java/sdn-mpls-ml-odl-cs-app/**"
      - "src/main/java/baseline-odl/**"
      - ".github/workflows/controller-image.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "src/main/java/sdn-mpls-ml-odl-cs-app/**"
      - "src/main/java/baseline-odl/**"
      - ".github/workflows/controller-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: arellanosantiago/sdn-mpls-ai-tech-demo-opendaylight:0.23.1-baseline

jobs:
  test:
    name: Compile and run Maven tests
    runs-on: ubuntu-latest
    container: maven:3.9.9-eclipse-temurin-21
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-java21-${{ hashFiles('src/main/java/sdn-mpls-ml-odl-cs-app/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-java21-

      - name: Compile and run tests
        working-directory: src/main/java/sdn-mpls-ml-odl-cs-app
        run: mvn clean test -Pq -Dcheckstyle.skip=true

  build:
    name: Build controller image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push controller image
        uses: docker/build-push-action@v7
        with:
          context: ./src/main/java
          file: ./src/main/java/baseline-odl/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=controller-image
          cache-to: type=gha,mode=max,scope=controller-image
