name: Python API image

on:
  push:
    branches: ["master"]
    paths:
      - "src/main/python/api/**"
      - ".github/workflows/python-api-image.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "src/main/python/api/**"
      - ".github/workflows/python-api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: arellanosantiago/sdn-mpls-ai-tech-demo-python-inference-api:0.23.1-baseline

jobs:
  build:
    name: Build Python API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push Python API image
        uses: docker/build-push-action@v7
        with:
          context: ./src/main/python/api
          file: ./src/main/python/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=python-api-image
          cache-to: type=gha,mode=max,scope=python-api-image
